<div class="esqueci-page">
  <div class="esqueci-card">
    <img class="logo" src="neurovita.png" alt="NeuroVita" />

    <h1>Esqueci minha senha</h1>
    <p class="descricao">
      Para recuperar o acesso, digite o seu e-mail cadastrado.
    </p>

    <div class="campo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <input type="email" placeholder="E-mail" />
    </div>

    <button type="button" class="btn-enviar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Enviar código de recuperação
    </button>

    <a class="voltar" routerLink="/login">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar para o login
    </a>
  </div>
</div>
