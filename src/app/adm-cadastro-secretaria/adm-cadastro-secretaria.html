<div class="pagina">
  <header class="topo">
    <button class="voltar" type="button">←</button>
    <div>
      <h1>Cadastrar Nova Secretária</h1>
      <p>Preencha as informações para realizar o cadastro da secretária</p>
    </div>
  </header>

  <form [formGroup]="form" (ngSubmit)="cadastrar()" class="card">
    <div class="colunas">

      <!-- COLUNA ESQUERDA -->
      <section class="coluna">
        <h2>Dados Pessoais</h2>
        <input type="text" placeholder="Nome completo" formControlName="nome" />
        <input type="date" formControlName="dataNascimento" />
        <input type="email" placeholder="E-mail" formControlName="email" />
        <input type="text" placeholder="CPF" formControlName="cpf" />
        <input type="tel" placeholder="Telefone" formControlName="telefone" />
        <input type="text" placeholder="Endereço" formControlName="endereco" />
      </section>

      <!-- COLUNA DIREITA -->
      <section class="coluna">
        <h2>Dados Profissionais</h2>
        <input type="text" formControlName="cargo" />
        <input type="date" formControlName="dataAdmissao" />

        <h2 class="espaco-topo">Dados de Acesso</h2>
        <div class="box">
          <input type="email" placeholder="E-mail de acesso" formControlName="emailAcesso" />
          <div class="linha">
            <input type="text" placeholder="Senha Temporária" formControlName="senhaTemporaria" />
            <button type="button" class="btn-escuro" (click)="gerarSenha()">⟳ Gerar senha</button>
          </div>
          <label>
            <input type="checkbox" formControlName="enviarBoasVindas" />
            Enviar e-mail de boas vindas com as instruções de acesso
          </label>
        </div>
      </section>
    </div>

    <footer class="acoes">
      <button type="button" class="btn-claro" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-escuro">Cadastrar</button>
    </footer>
  </form>
</div>
