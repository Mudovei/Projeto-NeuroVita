<div class="login-page">
  <div class="deco"><span></span><span></span><span></span><span></span></div>

  <div class="login-card">
    <div class="brand">
      <img src="neurovita.png" alt="NeuroVita" />
    </div>
    <h1 class="welcome">Bem-vindo ao NeuroVita</h1>

    <form (submit)="entrar($event)">
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" required placeholder="E-mail" />
      </div>

      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input [type]="mostrarSenha ? 'text' : 'password'" required placeholder="Senha" />
        <button type="button" class="toggle" aria-label="Mostrar senha" (click)="mostrarSenha = !mostrarSenha">
          <svg [class.hidden]="mostrarSenha" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg [class.hidden]="!mostrarSenha" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <div class="forgot"><a routerLink="/esqueci-senha">Esqueci minha senha</a></div>

      <button type="submit" class="btn btn-primary">Entrar</button>

    </form>
  </div>
</div>
